<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // flash guard: hide page until hydration applies stored/detected zh (removed in +layout onMount)
      try {
        var lang = localStorage.getItem('lang') || (navigator.language || '').slice(0, 2);
        if (lang === 'zh') {
          document.documentElement.classList.add('zh-pending');
          document.documentElement.lang = 'zh-CN';
        }
      } catch (e) {}
    </script>
    <style>
      .zh-pending body {
        visibility: hidden;
      }
    </style>
    <link rel="canonical" href="https://archbaer-dev.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Kebaili — Software Engineer" />
    <meta property="og:description" content="Software engineer portfolio — cybersecurity, data engineering, full-stack systems." />
    <meta property="og:url" content="https://archbaer-dev.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
